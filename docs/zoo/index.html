<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Zoo Defense</title>
    <style>
      /* Fill the window, whatever shape it is.
         Unity's default template pins the canvas at a fixed 960x600 on
         desktop, which is clipped in any window narrower than that and
         leaves the game in a small box in a large one. The camera already
         reframes itself from the aspect ratio (see CameraRig), so the page
         only has to hand it the whole viewport and get out of the way. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b2118;
      }
      #unity-container {
        position: absolute;
        inset: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        /* Stops the browser handing touch drags to the page instead of
           to the game. */
        touch-action: none;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #cfe0c4;
      }
      #unity-progress-bar-empty {
        width: 240px;
        height: 12px;
        margin: 14px auto 0;
        background: #2c3529;
        border-radius: 6px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #6fae5c;
        transition: width 0.2s ease;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        font-family: system-ui, sans-serif;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-label">Opening the zoo…</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; color: white; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/zoo.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/zoo.data.unityweb",
        frameworkUrl: buildUrl + "/zoo.framework.js.unityweb",
        codeUrl: buildUrl + "/zoo.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Zoo Defense",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(() => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
